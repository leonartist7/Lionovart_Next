<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIONOVART responsive review</title>
<style>
  * { box-sizing:border-box } body { margin:0;background:#202024;color:#f7f4ef;font:1rem/1.5 system-ui,sans-serif }
  header { padding:1rem;display:flex;gap:1rem;flex-wrap:wrap;align-items:end;position:sticky;top:0;background:#202024;z-index:1 }
  label { display:grid;gap:.25rem } select,button,input { font:inherit;padding:.5em;background:#fff;color:#181818;border:0;border-radius:.25rem } input { width:5rem }
  main { padding:1rem;overflow:auto } iframe { display:block;border:0;outline:1px solid #777;background:#08080a;width:390px;height:844px;max-width:none }
  output { padding:.5rem 1rem;display:block;font-size:.875rem } p { margin:0;font-size:.875rem;max-width:40ch }

  html[data-door-study] body { margin:0;background:#030407; }
  html[data-door-study] header, html[data-door-study] output { display:none; }
  html[data-door-study] main { padding:0;overflow:hidden; }
  html[data-door-study] iframe { width:100vw!important;height:100dvh!important;outline:0; }
</style>
<header>
  <label>Language<select id="locale"><option value="en">English</option><option value="fr">Français</option></select></label>
  <label>Viewport<select id="size"><option>390x844</option><option>320x568</option><option>360x800</option><option>768x1024</option><option>1023x768</option><option>1024x768</option><option>1025x768</option><option>1280x720</option><option>1366x520</option><option>1440x640</option><option>1536x740</option><option>1440x900</option><option>1920x1080</option><option>2560x1440</option><option>844x390</option></select></label>
  <label>Text size<select id="text"><option value="16">100%</option><option value="20">125%</option><option value="24">150%</option><option value="32">200%</option></select></label>
  <label>Text spacing<select id="spacing"><option value="normal">Default</option><option value="expanded">Expanded</option></select></label>
  <label>Reading stop<select id="chapter"><option value="hero">Hero</option><option value="cards-early">Opening cards — early</option><option value="cards">Opening cards — settled</option><option value="statement">Statement</option><option value="services">Services</option><option value="gallery">Gallery</option><option value="partnership">Partnership</option></select></label>
  <button id="go">Go to reading stop</button>
  <button id="check">Measure layout</button>
  <label>Handoff %<input id="handoff" type="number" min="0" max="100" value="35" step="1"></label>
  <button id="go-handoff">Review handoff</button>
  <label>Doorway %<input id="doorway" type="number" min="0" max="100" value="45" step="1"></label>
  <button id="go-doorway">Review doorway</button>
  <label>Project<select id="row"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option><option value="4">5</option><option value="5">6</option><option value="6">7</option><option value="7">8</option><option value="8">9</option><option value="9">10</option></select></label>
  <label>Project advance %<input id="advance" type="number" min="0" max="130" value="26" step="1"></label>
  <button id="go-row">Review project</button>
  <label>Finale %<input id="finale" type="number" min="70" max="100" value="84" step="1"></label>
  <button id="go-finale">Review red finale</button>
  <button id="profile-toggle">Start 30s profile</button>
  <p>Review fixture: iframe widths exercise real media queries. Text sizing simulates a root-font preference, not browser zoom or physical touch hardware.</p>
</header>
<output id="result" aria-live="polite">Loading review…</output>
<output id="profile-result" aria-live="polite">Profile idle</output>
<main><iframe id="site" src="/" title="LIONOVART viewport under review"></iframe></main>
<script>
  const frame=document.querySelector('#site'), result=document.querySelector('#result');
  function settings() {
    const [width,height]=document.querySelector('#size').value.split('x').map(Number);
    frame.style.width=width+'px';frame.style.height=height+'px';
    const doc=frame.contentDocument;if(!doc?.body)return;
    doc.documentElement.style.fontSize=document.querySelector('#text').value+'px';
    let style=doc.querySelector('#review-spacing');
    if(!style){style=doc.createElement('style');style.id='review-spacing';doc.head.append(style)}
    style.textContent=document.querySelector('#spacing').value==='expanded'?'[data-service-world] p,[data-service-world] h2,[data-service-world] h3,[data-service-world] button,[data-work-tags] > span {line-height:1.5!important;letter-spacing:.12em!important;word-spacing:.16em!important} [data-service-world] p {margin-bottom:2em!important}':'';
    frame.contentWindow.dispatchEvent(new Event('resize'));
  }
  function measure() {
    const doc=frame.contentDocument,win=frame.contentWindow,world=doc.querySelector('[data-service-world]');
    result.textContent=JSON.stringify({viewport:[win.innerWidth,win.innerHeight],rootFont:win.getComputedStyle(doc.documentElement).fontSize,mode:world?.dataset.storyLayoutReason,static:world?.dataset.storyStatic,axis:doc.querySelector('[data-gallery-stage]')?.dataset.galleryAxis,projects:doc.querySelectorAll('[data-work-tags]').length,overflow:doc.documentElement.scrollWidth>win.innerWidth});
  }
  function projectProgress(count, advance) {
    let low=0, high=.76;
    for(let i=0;i<40;i++){
      const mid=(low+high)/2, linear=mid/.76*(count+.5);
      const travel=linear-.82*Math.sin(linear*Math.PI*2)/(Math.PI*2);
      if(travel<advance) low=mid; else high=mid;
    }
    return (low+high)/2;
  }
  function go() {
    const doc=frame.contentDocument,win=frame.contentWindow,key=document.querySelector('#chapter').value;
    const world=doc.querySelector('[data-service-world]'),pinned=world?.dataset.storyStatic==='false';
    const selector={hero:'.hero-opening','cards-early':'.hero-opening',cards:'.hero-opening',statement:'[data-card-exit]',services:'[data-services-runway]',gallery:'[data-gallery-runway]',partnership:'[data-gallery-runway]'}[key];
    let el=doc.querySelector(selector);if(!el)return;
    let top=win.scrollY+el.getBoundingClientRect().top;
    if(pinned&&(key==='hero'||key==='cards'||key==='cards-early')) {
      const intro=el.closest('[data-work-intro]'),transition=el.closest('[data-work-services-transition]');
      if(intro&&transition)top=win.scrollY+transition.getBoundingClientRect().top+el.getBoundingClientRect().top-intro.getBoundingClientRect().top;
    }
    if(key==='cards'||key==='cards-early') {
      if(pinned) {
        const stage=doc.querySelector('.hero-opening-stage'),exit=doc.querySelector('[data-card-exit]');
        const css=el.style,front=parseFloat(css.getPropertyValue('--opening-front-overflow'))||0;
        const extra=parseFloat(css.getPropertyValue('--opening-benefit-overflow'))||0;
        const overlap=exit?Math.max(0,-parseFloat(win.getComputedStyle(exit).marginTop)):0;
        const span=Math.max(1,el.offsetHeight-stage.offsetHeight-overlap-extra-front);
        top+=(parseFloat(css.getPropertyValue('--hero-overflow'))||0)+span*(key==='cards-early'?.52:.84);
      } else {el=doc.querySelector('[data-opening-benefits]');if(el)top=win.scrollY+el.getBoundingClientRect().top-100}
    }
    if(key==='statement') {if(pinned)top+=.35*(el.offsetHeight+win.innerHeight)-win.innerHeight;else {el=doc.querySelector('[data-shaping-message]');top=win.scrollY+el.getBoundingClientRect().top}}
    if(key==='services'&&pinned)top+=win.innerHeight*.2;
    if(key==='gallery'&&pinned)top+=(el.offsetHeight-win.innerHeight*.85)*projectProgress(Number(doc.querySelector('[data-gallery-rows]')?.dataset.galleryRows)||10,.26);
    if(key==='partnership') {if(pinned)top+=(el.offsetHeight-win.innerHeight*.85)*.94;else {el=doc.querySelector('[data-partnership-static-mark]');top=win.scrollY+el.getBoundingClientRect().top}}
    win.scrollTo({top,behavior:'instant'});measure();
  }
  document.querySelector('#go-finale').addEventListener('click',()=>{
    const win=frame.contentWindow,el=frame.contentDocument.querySelector('[data-gallery-runway]');
    if(!el)return;
    const p=Math.max(.70,Math.min(1,Number(document.querySelector('#finale').value)/100));
    win.scrollTo({top:win.scrollY+el.getBoundingClientRect().top+p*(el.offsetHeight-win.innerHeight*.85),behavior:'instant'});measure();
  });
  if (location.hash === '#doorway') {
    document.documentElement.dataset.doorStudy = '';
    frame.addEventListener('load', async () => {
      const doc = frame.contentDocument;
      await doc.fonts.ready;
      let attempts = 0;
      const showDoor = () => {
        if (doc.querySelector('[data-service-podium]') || ++attempts >= 120) {
          document.querySelector('#go-doorway').click();
        } else {
          setTimeout(showDoor, 50);
        }
      };
      requestAnimationFrame(showDoor);
    });
  }
  frame.addEventListener('load',settings);
  document.querySelector('#locale').addEventListener('change',event=>{frame.src=event.target.value==='fr'?'/fr':'/'});
  for(const id of ['size','text','spacing'])document.querySelector('#'+id).addEventListener('change',settings);
  document.querySelector('#go').addEventListener('click',go);
  document.querySelector('#check').addEventListener('click',measure);
  document.querySelector('#go-handoff').addEventListener('click',()=>{
    const doc=frame.contentDocument,win=frame.contentWindow,el=doc.querySelector('[data-card-exit]');
    if(!el)return;
    const p=Math.max(0,Math.min(100,Number(document.querySelector('#handoff').value)||0))/100;
    const pinned=doc.querySelector('[data-service-world]')?.dataset.storyStatic==='false';
    const top=pinned?win.scrollY+el.getBoundingClientRect().top-win.innerHeight+p*(el.offsetHeight+win.innerHeight):win.scrollY+doc.querySelector('[data-shaping-message]').getBoundingClientRect().top;
    win.scrollTo({top,behavior:'instant'});measure();
  });
  document.querySelector('#go-doorway').addEventListener('click',()=>{
    const doc=frame.contentDocument,win=frame.contentWindow,el=doc.querySelector('[data-gallery-runway]');
    if(!el)return;
    const p=Math.max(0,Math.min(100,Number(document.querySelector('#doorway').value)||0))/100;
    const pinned=doc.querySelector('[data-service-world]')?.dataset.storyStatic==='false';
    const top=win.scrollY+el.getBoundingClientRect().top-(pinned?win.innerHeight*1.1*(1-p):0);
    win.scrollTo({top,behavior:'instant'});measure();
  });
  document.querySelector('#go-row').addEventListener('click',()=>{
    const doc=frame.contentDocument,win=frame.contentWindow,el=doc.querySelector('[data-gallery-runway]');
    if(!el)return;
    const pairs=Number(doc.querySelector('[data-gallery-rows]')?.dataset.galleryRows)||10;
    const row=Math.min(pairs-1,Number(document.querySelector('#row').value));
    const advance=Math.max(0,Math.min(130,Number(document.querySelector('#advance').value)||0))/100;
    const pinned=doc.querySelector('[data-service-world]')?.dataset.storyStatic==='false';
    let top=win.scrollY+el.getBoundingClientRect().top;
    if(pinned){
      top+=projectProgress(pairs,row+advance)*(el.offsetHeight-win.innerHeight*.85);
    }else{const project=doc.querySelectorAll('[data-static-project]')[row];if(project)top=win.scrollY+project.getBoundingClientRect().top-5.25*parseFloat(win.getComputedStyle(doc.documentElement).fontSize)}
    win.scrollTo({top,behavior:'instant'});measure();
  });
  // Review-only instrumentation: bounded read-only observers, one RAF sampler,
  // no playback changes, synthetic input, or animation-state overrides.
  let recording=null;
  const profileOutput=document.querySelector('#profile-result'),profileButton=document.querySelector('#profile-toggle');
  function stopProfile(reason='manual') {
    const current=recording;if(!current)return;recording=null;
    current.win.cancelAnimationFrame(current.raf);current.observers.forEach(observer=>observer.disconnect());
    const sorted=current.frames.slice().sort((a,b)=>a-b),percentile=p=>sorted.length?sorted[Math.min(sorted.length-1,Math.floor((sorted.length-1)*p))]:null;
    const videos=[...current.doc.querySelectorAll('video')];
    const report={reason,viewport:[current.win.innerWidth,current.win.innerHeight],locale:current.doc.documentElement.lang,
      durationMs:current.win.performance.now()-current.start,frameSamples:sorted.length,
      frameMs:{median:percentile(.5),p95:percentile(.95),p99:percentile(.99),max:sorted.at(-1)??null},
      over33ms:sorted.filter(value=>value>33.4).length,longTasks:current.longTasks,
      layoutShift:current.shifts.reduce((total,entry)=>total+entry.value,0),layoutShifts:current.shifts,
      observers:current.supported,hiddenSamples:current.hidden,
      media:{total:videos.length,playing:videos.filter(video=>!video.paused).length},
      canvases:current.doc.querySelectorAll('canvas').length};
    profileOutput.textContent=JSON.stringify(report);profileButton.textContent='Start 30s profile';
  }
  profileButton.addEventListener('click',()=>{
    if(recording){stopProfile();return}
    const win=frame.contentWindow,doc=frame.contentDocument;
    const current={win,doc,start:win.performance.now(),last:null,raf:0,frames:[],longTasks:[],shifts:[],observers:[],supported:[],hidden:0};
    recording=current;profileButton.textContent='Stop profile';profileOutput.textContent='Recording native scrolling for up to 30 seconds…';
    for(const type of ['longtask','layout-shift']) {
      if(!win.PerformanceObserver?.supportedEntryTypes.includes(type))continue;
      const observer=new win.PerformanceObserver(list=>{for(const entry of list.getEntries()){
        if(type==='longtask')current.longTasks.push({start:entry.startTime,duration:entry.duration});
        else if(!entry.hadRecentInput)current.shifts.push({start:entry.startTime,value:entry.value});
      }});observer.observe({type,buffered:false});current.observers.push(observer);current.supported.push(type);
    }
    function tick(now){
      if(recording!==current)return;
      if(doc.hidden){current.hidden++;current.last=null}
      else {if(current.last!==null)current.frames.push(now-current.last);current.last=now}
      if(now-current.start>=30000){stopProfile('30s limit');return}
      current.raf=win.requestAnimationFrame(tick);
    }
    current.raf=win.requestAnimationFrame(tick);
  });
  frame.addEventListener('load',()=>stopProfile('route changed'));
  window.addEventListener('pagehide',()=>stopProfile('review closed'));
</script>
</html>
