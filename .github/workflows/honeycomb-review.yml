name: Hexagon and Selected Work review
on:
  push:
    branches: [review/hexagon-work-canvas]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hexagon-work-canvas
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, tablet, phone]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: lionovart-dev.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: lionovart-dev
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: lionovart-dev.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Verify the lattice and transition math
        run: node --test scripts/intro-readiness.test.mjs scripts/card-handoff.test.mjs scripts/card-lettering.test.mjs scripts/white-card-story.test.mjs scripts/honeycomb-journey.test.mjs scripts/gallery-journey.test.mjs scripts/service-gallery-handoff.test.mjs
      - name: Build and type-check the homepage
        run: npm run build
      - name: Install Chromium verification tools
        run: |
          npm install --prefix /tmp/story-qa --no-package-lock playwright@1.56.1
          /tmp/story-qa/node_modules/.bin/playwright install chromium
      - name: Check the running build and capture the gallery
        env:
          STORY_PREVIEW: http://127.0.0.1:3100
          STORY_VIEWPORT: ${{ matrix.viewport }}
        run: |
          mkdir -p verification-output/honeycomb
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3100 >verification-output/honeycomb/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 2 "$STORY_PREVIEW/qa/white-card-version.json"
          node scripts/verify-opening-refinements.mjs
          if [ "$STORY_VIEWPORT" = desktop ]; then node scripts/verify-chapter-previews.mjs; fi
          node scripts/verify-honeycomb-preview.mjs
      - name: Upload viewport review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: honeycomb-${{ matrix.viewport }}
          path: verification-output/honeycomb/
