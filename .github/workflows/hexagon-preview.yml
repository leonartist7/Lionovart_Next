name: Hexagon preview verification
on:
  push:
    branches: [review/hexagon-preview-check]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hexagon-preview-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: lionovart-dev.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: lionovart-dev
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: lionovart-dev.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Build and type-check the homepage
        run: npm run build
      - name: Install Chromium verification tools
        run: |
          npm install --prefix /tmp/story-qa --no-package-lock playwright@1.56.1
          /tmp/story-qa/node_modules/.bin/playwright install chromium
      - name: Check the running build and record both layouts
        env:
          STORY_PREVIEW: http://127.0.0.1:3100
          STORY_REVIEW_FOCUS: shape
        run: |
          mkdir -p verification-output/white-card
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3100 >verification-output/white-card/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 2 "$STORY_PREVIEW/qa/white-card-version.json"
          node scripts/verify-white-card-preview.mjs
      - name: Upload desktop and phone review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hexagon-preview-desktop-and-phone
          path: verification-output/white-card/
