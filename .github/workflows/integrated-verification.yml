name: Integrated verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: integrated-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      FIREBASE_PROJECT_ID: lionovart-dev
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: lionovart-dev.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: lionovart-dev
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: lionovart-dev.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      NOVA_ADMIN_EMAILS: leonartist.cs@gmail.com
      NOVA_WS_SECRET: ci-only-voice-token-secret-never-use-in-production
      WHATSAPP_APP_SECRET: dev-test-secret
      WHATSAPP_VERIFY_TOKEN: dev-test-verify-token
      WHATSAPP_ACCESS_TOKEN: ""
      GEMINI_API_KEY: ""
      RESEND_API_KEY: ""
      PORTAL_BASE: http://localhost:3000
      PORT: "3000"
      HOSTNAME: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked application dependencies
        run: npm ci
      - name: Motion and intro regression tests
        run: node --test scripts/intro-readiness.test.mjs scripts/intro-scene.test.mjs scripts/lion-motion.test.mjs
      - name: Production build and type checking
        run: npm run build
      - name: Install verification tools without changing the lockfile
        run: npm install --no-save --package-lock=false firebase-tools@14.17.0 playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Portal security, integration and browser checks
        run: npx firebase emulators:exec --only auth,firestore --project lionovart-dev "node scripts/verify-integrated-runtime.mjs"
      - name: Verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-verification
          path: verification-output/
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the Cloud Run production image with test-only public config
        run: |
          docker build --tag lionovart-verify \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=demo-key \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=lionovart-dev.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=lionovart-dev \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=lionovart-dev.appspot.com \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000 \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:0000000000000000000000 \
            .
      - name: Confirm the image starts and serves the portal demo
        run: |
          docker run --detach --name integrated-container --publish 8080:8080 \
            --env NOVA_WS_SECRET=ci-only-container-secret lionovart-verify
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/portal/demo/content > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs integrated-container
          exit 1
      - name: Container logs
        if: always()
        run: docker logs integrated-container 2>/dev/null || true
