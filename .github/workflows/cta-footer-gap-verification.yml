name: CTA footer gap verification
on:
  push:
    branches: [codex/cta-mobile-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Current Chromium is needed for small/dynamic viewport emulation.
      - run: npm install --no-save --package-lock=false playwright@latest
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run build
      - name: Reproduce the gap on the previous deployment
        if: matrix.engine == 'chromium'
        run: node scripts/verify-closing-footer-gap.mjs
        env:
          CTA_BASE_URL: https://lionovartnext-bo49o1bmb-lionovart.vercel.app
          CTA_EXPECT_GAP: "1"
      - name: Verify the fixed production build
        run: node scripts/verify-closing-footer-gap.mjs
        env:
          CTA_WEBKIT: ${{ matrix.engine == 'webkit' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footer-gap-${{ matrix.engine }}
          path: verification-output/footer-gap
