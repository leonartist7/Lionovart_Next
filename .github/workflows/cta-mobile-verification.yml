name: Closing CTA mobile verification
on:
  push:
    branches: [codex/cta-mobile-20261015]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npx eslint src/hooks/useSaveData.ts src/components/sections/ClosingMediaWall.tsx src/components/sections/ClosingCTA.tsx src/components/sections/HeroCycling.tsx src/components/ui/liquid-metal-button.tsx src/components/sections/ProcessLionJourney.tsx src/components/sections/lion-journey/engine.ts
      - run: node scripts/verify-closing-cta.mjs
        env:
          CTA_WEBKIT: ${{ matrix.engine == 'webkit' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closing-cta-${{ matrix.engine }}
          path: verification-output/closing-cta
