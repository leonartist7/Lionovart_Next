name: Prepare patched dependency candidate
on:
  push:
    branches: [integration/lionovart-latest-20261003]
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve patched manifests without a forced major upgrade
        run: node scripts/prepare-dependency-candidate.mjs
