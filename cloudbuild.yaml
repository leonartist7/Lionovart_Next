steps:
  # Redeploy marker 2026-08-25: publish testimonial 20-percent stagger and globe transition.
  # Step 1: Build the Docker image
  # - NEXT_PUBLIC_* vars are hardcoded here (they're not sensitive)
  # - Secrets from Secret Manager are accessed via secretEnv (double-$$ syntax)
  # - Plain Cloud Run env vars (WHATSAPP_NUMBER, BOOKING_URL, etc.) are also passed
  #   as build args so Next.js module-level code doesn't throw during `npm run build`
  - name: 'gcr.io/cloud-builders/docker'
    secretEnv:
      - 'RESEND_API_KEY'
      - 'GEMINI_API_KEY'
      - 'SANITY_API_READ_TOKEN'
      - 'FIREBASE_ADMIN_PRIVATE_KEY'
    args:
      - 'build'
      - '--no-cache'
      # ── NEXT_PUBLIC_ vars (baked into bundle at build time) ──────────────
      - '--build-arg'
      - 'NEXT_PUBLIC_SANITY_DATASET=production'
      - '--build-arg'
      - 'NEXT_PUBLIC_SANITY_PROJECT_ID=chd9fnkj'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyCCH7ej_5ksURSs_bvLVuBln-7fbxsFlH4'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=lionovart-nova-agent.firebaseapp.com'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=lionovart-nova-agent'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=lionovart-nova-agent.firebasestorage.app'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=790809554220'
      - '--build-arg'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=1:790809554220:web:d945369d99dbea6153d089'
      - '--build-arg'
      - 'NEXT_PUBLIC_POSTHOG_KEY=phc_se54cuL8AzG9RNeuMVfYZVoUQhr8wCCABP35EsFc5KhG'
      - '--build-arg'
      - 'NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com'
      # ── Plain server-side env vars (not in Secret Manager) ──────────────
      - '--build-arg'
      - 'WHATSAPP_NUMBER=15878974772'
      - '--build-arg'
      - 'BOOKING_URL=https://calendar.app.google/xk1LQjziPqAsxzHV8'
      - '--build-arg'
      - 'FIREBASE_ADMIN_CLIENT_EMAIL=firebase-adminsdk-fbsvc@lionovart-nova-agent.iam.gserviceaccount.com'
      - '--build-arg'
      - 'FIREBASE_PROJECT_ID=lionovart-nova-agent'
      # ── Secrets from Secret Manager ──
      # secretEnv exposes these to the step's environment.
      # By passing just the key to --build-arg, Docker automatically pulls the value from the environment.
      - '--build-arg'
      - 'RESEND_API_KEY'
      - '--build-arg'
      - 'GEMINI_API_KEY'
      - '--build-arg'
      - 'SANITY_API_READ_TOKEN'
      - '--build-arg'
      - 'FIREBASE_ADMIN_PRIVATE_KEY'
      - '-t'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0318381471/cloud-run-source-deploy/lionovart-web:$COMMIT_SHA'
      - '.'

  # Step 2: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0318381471/cloud-run-source-deploy/lionovart-web:$COMMIT_SHA'

  # Step 3: Deploy to Cloud Run
  # At runtime, Cloud Run injects secrets again (so the running container always has
  # fresh values even if Secret Manager versions are rotated later)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lionovart-next-tailwind'
      - '--image'
      - 'us-central1-docker.pkg.dev/gen-lang-client-0318381471/cloud-run-source-deploy/lionovart-web:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--timeout'
      - '1800'
      # Only map actual Secret Manager secrets for runtime injection
      # Plain env vars (WHATSAPP_NUMBER, BOOKING_URL, etc.) already set in
      # Cloud Run console — they survive redeploys automatically
      - '--update-secrets'
      - 'RESEND_API_KEY=RESEND_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,SANITY_API_READ_TOKEN=SANITY_API_READ_TOKEN:latest,FIREBASE_ADMIN_PRIVATE_KEY=FIREBASE_ADMIN_PRIVATE_KEY:latest'

# Tell Cloud Build how to fetch the secrets from Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/RESEND_API_KEY/versions/latest
      env: 'RESEND_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: 'GEMINI_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/SANITY_API_READ_TOKEN/versions/latest
      env: 'SANITY_API_READ_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_ADMIN_PRIVATE_KEY/versions/latest
      env: 'FIREBASE_ADMIN_PRIVATE_KEY'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'us-central1-docker.pkg.dev/gen-lang-client-0318381471/cloud-run-source-deploy/lionovart-web:$COMMIT_SHA'
